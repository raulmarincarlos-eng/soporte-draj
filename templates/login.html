<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Soporte DRAJ</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-green: #00e676;
            --neon-green-dim: rgba(0, 230, 118, 0.2);
            --bg-deep: #03070b;
            --card-bg: rgba(9, 15, 22, 0.85);
            --input-bg: rgba(3, 7, 11, 0.7);
        }

        body {
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--bg-deep);
            overflow: hidden;
            position: relative;
        }

        /* Hexagonal Cyber Grid Background */
        .cyber-grid {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                linear-gradient(rgba(0, 230, 118, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 230, 118, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: center center;
            z-index: 1;
            perspective: 1000px;
            transform-origin: center;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: translateY(0) scale(1.1); }
            100% { transform: translateY(40px) scale(1.1); }
        }

        /* Ambient Glows */
        .glow-orb-1, .glow-orb-2 {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 2;
            opacity: 0.4;
        }
        .glow-orb-1 {
            width: 400px; height: 400px;
            background: rgba(0, 230, 118, 0.15);
            top: -100px; left: -100px;
            animation: floatOrb 8s infinite alternate ease-in-out;
        }
        .glow-orb-2 {
            width: 300px; height: 300px;
            background: rgba(14, 165, 233, 0.1);
            bottom: -50px; right: -50px;
            animation: floatOrb 10s infinite alternate-reverse ease-in-out;
        }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 50px) scale(1.2); }
        }

        /* Glassmorphism Card Ultra Premium */
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-top: 1px solid rgba(0, 230, 118, 0.3);
            border-bottom: 1px solid rgba(0, 230, 118, 0.1);
            border-radius: 24px;
            padding: 50px 45px;
            width: 100%;
            max-width: 440px;
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.8),
                0 0 40px var(--neon-green-dim),
                inset 0 0 20px rgba(0, 230, 118, 0.05);
            z-index: 10;
            animation: slideUpFade 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(40px);
            position: relative;
        }

        @keyframes slideUpFade {
            to { opacity: 1; transform: translateY(0); }
        }

        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }
        .login-header img {
            width: 85px;
            height: auto;
            background: rgba(0, 0, 0, 0.3);
            padding: 12px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 
                0 10px 20px rgba(0,0,0,0.5),
                0 0 15px var(--neon-green-dim);
            margin-bottom: 25px;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .login-header img:hover {
            transform: scale(1.15) translateY(-5px) rotate(5deg);
            border-color: rgba(0, 230, 118, 0.6);
            box-shadow: 
                0 15px 35px rgba(0,0,0,0.6),
                0 0 30px rgba(0, 230, 118, 0.4);
        }
        h2 {
            color: #ffffff;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 8px;
            font-size: 2rem;
            text-shadow: 0 0 10px rgba(255,255,255,0.1);
        }
        p.subtitle {
            color: #8b9bb4;
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 600;
        }

        /* Inputs Ultra Premium */
        .form-label {
            color: #a0aec0;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 10px;
            margin-left: 5px;
        }
        
        .input-group {
            background: var(--input-bg);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }
        
        .input-group:focus-within {
            background: rgba(10, 20, 30, 0.9);
            border-color: var(--neon-green);
            box-shadow: 
                inset 0 2px 4px rgba(0,0,0,0.5),
                0 0 0 3px rgba(0, 230, 118, 0.15),
                0 0 15px rgba(0, 230, 118, 0.1);
            transform: translateY(-2px);
        }
        
        .input-group-text {
            background: transparent;
            border: none;
            color: var(--neon-green);
            padding-left: 22px;
            font-size: 1.1rem;
        }
        
        .form-control {
            background: transparent;
            border: none;
            color: #ffffff;
            padding: 18px 15px;
            font-size: 15px;
            font-weight: 400;
            letter-spacing: 0.5px;
        }
        .form-control::placeholder {
            color: #4a5568;
            font-weight: 300;
        }
        .form-control:focus {
            background: transparent;
            color: #ffffff;
            box-shadow: none;
        }

        /* Button Next-Level */
        .btn-login {
            background: var(--neon-green);
            border: none;
            border-radius: 16px;
            padding: 18px;
            font-weight: 800;
            font-size: 15px;
            letter-spacing: 2px;
            color: #03070b;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            box-shadow: 0 10px 25px rgba(0, 230, 118, 0.3);
            margin-top: 10px;
        }
        .btn-login::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: all 0.6s ease;
        }
        .btn-login:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 
                0 15px 35px rgba(0, 230, 118, 0.5),
                0 0 20px rgba(0, 230, 118, 0.4);
            background: #00fa82;
            color: #000;
        }
        .btn-login:hover::before {
            left: 100%;
        }
        .btn-login:active {
            transform: translateY(1px);
            box-shadow: 0 5px 15px rgba(0, 230, 118, 0.3);
        }

        .back-link {
            color: #64748b;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
            display: inline-block;
            margin-top: 10px;
            font-size: 13px;
            letter-spacing: 0.5px;
        }
        .back-link:hover {
            color: var(--neon-green);
            text-shadow: 0 0 10px var(--neon-green-dim);
        }
        
        /* Custom Alert */
        .alert-custom {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            border-radius: 14px;
            font-size: 14px;
            padding: 15px;
            font-weight: 600;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <!-- Cyber Background Elements -->
    <div class="cyber-grid"></div>
    <div class="glow-orb-1"></div>
    <div class="glow-orb-2"></div>

    <div class="glass-card">
        <div class="login-header">
            <img src="{{ url_for('static', filename='img/logo_gore_junin.png') }}" alt="Logo DRAJ">
            <h2>SISTC-DRAJ</h2>
            <p class="subtitle">Panel de Control Administrativo</p>
        </div>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-custom shadow-sm mb-4">
                        <i class="fas fa-exclamation-circle me-2"></i> {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        
        <form method="POST" action="{{ url_for('login') }}">
            <div class="mb-4">
                <label class="form-label">Usuario</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-user-shield"></i></span>
                    <input type="text" class="form-control" name="username" required autofocus placeholder="Ingresa tu usuario">
                </div>
            </div>
            <div class="mb-5">
                <label class="form-label">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                    <input type="password" class="form-control" name="password" required placeholder="••••••••">
                </div>
            </div>
            <button type="submit" class="btn btn-login w-100">
                Iniciar Sesión <i class="fas fa-arrow-right ms-2"></i>
            </button>
            <div class="text-center mt-4">
                <a href="{{ url_for('solicitar') }}" class="back-link"><i class="fas fa-chevron-left me-2" style="font-size:10px;"></i> Portal de Solicitudes</a>
            </div>
        </form>
    </div>

</body>
</html>
