<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTC-DRAJ | Autenticación Segura</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-accent: #00f2fe;
            --secondary-accent: #4facfe;
            --dark-bg: #090e17;
            --glass-bg: rgba(16, 25, 40, 0.5);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100vh;
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--dark-bg);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 3D Background Container */
        #vanta-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
        }

        /* Ambient Glow Behind Card */
        .ambient-glow {
            position: absolute;
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(79, 172, 254, 0.15) 0%, transparent 60%);
            border-radius: 50%;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            filter: blur(50px);
            animation: pulseGlow 4s infinite alternate ease-in-out;
        }
        @keyframes pulseGlow {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            100% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
        }

        /* Floating 3D Card */
        .auth-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 480px;
            perspective: 1000px;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(20px) saturate(150%);
            -webkit-backdrop-filter: blur(20px) saturate(150%);
            border: 1px solid var(--glass-border);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            border-left: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            padding: 50px;
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.6),
                inset 0 0 0 1px rgba(255, 255, 255, 0.05);
            transform-style: preserve-3d;
        }

        /* Hover Reveal Effect on Border */
        .glass-panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 30px;
            padding: 2px;
            background: linear-gradient(135deg, var(--primary-accent), var(--secondary-accent));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.5s ease;
            z-index: -1;
        }
        .glass-panel:hover::before {
            opacity: 1;
        }

        /* Inner 3D Elements */
        .panel-content {
            transform: translateZ(40px); /* Lifts content up in 3D space */
            transform-style: preserve-3d;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 35px;
            transform: translateZ(50px);
        }
        
        .logo-container img {
            width: 85px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 22px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.4s ease;
        }
        .glass-panel:hover .logo-container img {
            transform: scale(1.1) rotateY(10deg);
            box-shadow: 0 20px 40px rgba(79, 172, 254, 0.3);
            border-color: rgba(79, 172, 254, 0.5);
        }

        .auth-title {
            color: var(--text-main);
            font-weight: 700;
            font-size: 1.8rem;
            margin-top: 20px;
            margin-bottom: 5px;
            letter-spacing: -0.5px;
        }
        .auth-subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 500;
        }

        /* Futuristic Floating Inputs */
        .input-group-3d {
            position: relative;
            margin-bottom: 30px;
            transform: translateZ(30px);
        }
        
        .input-control {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 18px 20px 18px 50px;
            color: var(--text-main);
            font-size: 1rem;
            font-family: 'Space Grotesk', sans-serif;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }
        
        .input-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1.2rem;
            transition: all 0.3s ease;
            pointer-events: none;
        }

        .input-control:focus {
            outline: none;
            background: rgba(0, 0, 0, 0.4);
            border-color: var(--primary-accent);
            box-shadow: 
                inset 0 2px 5px rgba(0,0,0,0.5),
                0 0 15px rgba(0, 242, 254, 0.2);
        }
        
        .input-control:focus + .input-icon {
            color: var(--primary-accent);
            filter: drop-shadow(0 0 5px var(--primary-accent));
        }

        /* Magnetic Liquid Button */
        .btn-liquid {
            width: 100%;
            background: linear-gradient(135deg, var(--secondary-accent), var(--primary-accent));
            border: none;
            border-radius: 16px;
            padding: 18px;
            color: #000;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            transform: translateZ(40px);
            box-shadow: 0 10px 20px rgba(0, 242, 254, 0.2);
        }
        
        .btn-liquid span {
            position: relative;
            z-index: 2;
        }

        .btn-liquid::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: left 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1;
        }

        .btn-liquid:hover {
            transform: translateZ(50px) scale(1.02);
            box-shadow: 0 15px 30px rgba(0, 242, 254, 0.4);
            color: #fff;
        }
        .btn-liquid:hover::before {
            left: 100%;
        }

        /* Return Link */
        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s ease;
            transform: translateZ(20px);
        }
        .back-link:hover {
            color: var(--text-main);
            text-shadow: 0 0 8px rgba(255,255,255,0.5);
        }

        /* Alert Custom */
        .alert-premium {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            backdrop-filter: blur(10px);
            color: #fca5a5;
            border-radius: 12px;
            padding: 12px 20px;
            font-size: 0.9rem;
            font-weight: 500;
            transform: translateZ(30px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <!-- 3D Interactive Background -->
    <div id="vanta-bg"></div>
    <div class="ambient-glow"></div>

    <div class="auth-wrapper">
        <!-- Vanilla Tilt applied to this card -->
        <div class="glass-panel" data-tilt data-tilt-max="10" data-tilt-speed="400" data-tilt-glare data-tilt-max-glare="0.2">
            <div class="panel-content">
                
                <div class="logo-container">
                    <img src="{{ url_for('static', filename='img/logo_gore_junin.png') }}" alt="Logo DRAJ">
                    <h2 class="auth-title">SISTC-DRAJ</h2>
                    <p class="auth-subtitle">Acceso Administrativo</p>
                </div>

                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-premium mb-4">
                                <i class="fas fa-engine-warning me-2"></i> {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                <form method="POST" action="{{ url_for('login') }}">
                    
                    <div class="input-group-3d">
                        <input type="text" class="input-control" name="username" required autocomplete="off" placeholder="Identificador de Usuario">
                        <i class="fas fa-fingerprint input-icon"></i>
                    </div>

                    <div class="input-group-3d" style="margin-bottom: 40px;">
                        <input type="password" class="input-control" name="password" required placeholder="Clave de Seguridad">
                        <i class="fas fa-shield-alt input-icon"></i>
                    </div>

                    <button type="submit" class="btn-liquid">
                        <span>Verificar Identidad <i class="fas fa-chevron-right ms-2"></i></span>
                    </button>

                    <div class="text-center">
                        <a href="{{ url_for('solicitar') }}" class="back-link">
                            <i class="fas fa-arrow-left me-2"></i> Retornar al Portal Público
                        </a>
                    </div>

                </form>
            </div>
        </div>
    </div>

    <!-- Core Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- 3D Background (Vanta NET) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
    
    <!-- 3D Hover Effect (Vanilla Tilt) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.0/vanilla-tilt.min.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Inicializar Fondo 3D Interactivo
            VANTA.NET({
                el: "#vanta-bg",
                mouseControls: true,
                touchControls: true,
                gyroControls: false,
                minHeight: 200.00,
                minWidth: 200.00,
                scale: 1.00,
                scaleMobile: 1.00,
                color: 0x4facfe,
                backgroundColor: 0x090e17,
                points: 12.00,
                maxDistance: 22.00,
                spacing: 18.00
            });

            // Vanilla Tilt ya se auto-inicializa por el atributo data-tilt en el HTML, 
            // pero si queremos asegurarnos de las capas internas:
            VanillaTilt.init(document.querySelector(".glass-panel"), {
                max: 15,
                speed: 400,
                glare: true,
                "max-glare": 0.15,
                perspective: 1000
            });
        });
    </script>
</body>
</html>
