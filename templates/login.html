<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Soporte DRAJ</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #0ea5e9;
            --primary-blue-dark: #0284c7;
            --primary-green: #10b981;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --bg-light: #ffffff;
            --input-bg: #f8fafc;
            --input-border: #e2e8f0;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100vh;
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-light);
            overflow: hidden;
        }

        /* --- SPLIT LAYOUT --- */
        .split-container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        /* LEFT PANE: 3D Moving Waves */
        .left-pane {
            flex: 1.2;
            position: relative;
            overflow: hidden;
            display: none; /* Hide on mobile */
        }
        @media (min-width: 992px) {
            .left-pane { display: block; }
        }

        #vanta-ocean {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        /* RIGHT PANE: Clean, Elegant Light Form */
        .right-pane {
            flex: 1;
            max-width: 100%;
            background-color: var(--bg-light);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 5;
            box-shadow: -20px 0 50px rgba(0,0,0,0.05);
        }
        @media (min-width: 992px) {
            .right-pane { max-width: 550px; }
        }

        /* Premium Light Card */
        .login-card {
            background: #ffffff;
            padding: 50px 50px;
            width: 100%;
            max-width: 440px;
            animation: slideUpFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }
        @keyframes slideUpFade {
            to { opacity: 1; transform: translateY(0); }
        }

        .login-header {
            text-align: center;
            margin-bottom: 45px;
        }
        .login-header img {
            width: 90px;
            height: auto;
            background: #ffffff;
            padding: 15px;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.06);
            margin-bottom: 25px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(0,0,0,0.02);
        }
        .login-header img:hover {
            transform: scale(1.1) translateY(-5px);
            box-shadow: 0 15px 35px rgba(14, 165, 233, 0.15);
        }
        h2 {
            color: var(--text-dark);
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            font-size: 2.2rem;
        }
        p.subtitle {
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 500;
        }

        /* Clean Inputs */
        .form-label {
            color: var(--text-dark);
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            margin-left: 2px;
        }
        
        .input-group {
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .input-group:focus-within {
            background: #ffffff;
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.1);
        }
        .input-group-text {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding-left: 20px;
            font-size: 1.1rem;
            transition: color 0.3s;
        }
        .input-group:focus-within .input-group-text {
            color: var(--primary-blue);
        }
        .form-control {
            background: transparent;
            border: none;
            color: var(--text-dark);
            padding: 16px 15px;
            font-size: 15px;
            font-weight: 500;
        }
        .form-control::placeholder {
            color: #94a3b8;
            font-weight: 400;
        }
        .form-control:focus {
            background: transparent;
            color: var(--text-dark);
            box-shadow: none;
        }

        /* Button Modern */
        .btn-login {
            background: var(--text-dark);
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-weight: 600;
            font-size: 16px;
            color: #ffffff;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            margin-top: 20px;
            box-shadow: 0 10px 20px rgba(15, 23, 42, 0.15);
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(15, 23, 42, 0.25);
            background: #1e293b;
            color: #ffffff;
        }
        .btn-login:active {
            transform: translateY(0);
        }

        .back-link {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s;
            display: inline-block;
            margin-top: 25px;
            font-size: 14px;
        }
        .back-link:hover {
            color: var(--primary-blue);
        }
        
        .alert-custom {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #ef4444;
            border-radius: 12px;
            font-size: 14px;
            padding: 15px;
            font-weight: 500;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }

        /* Modern subtle geometric decoration on the right pane */
        .right-pane::before {
            content: '';
            position: absolute;
            top: 0; right: 0; width: 300px; height: 300px;
            background: radial-gradient(circle, rgba(14, 165, 233, 0.05) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }
    </style>
</head>
<body>

    <div class="split-container">
        
        <!-- LEFT PANE: Cinematic 3D Waves -->
        <div class="left-pane">
            <div id="vanta-ocean"></div>
        </div>

        <!-- RIGHT PANE: Clean Light Form -->
        <div class="right-pane">
            <div class="login-card">
                <div class="login-header">
                    <img src="{{ url_for('static', filename='img/logo_gore_junin.png') }}" alt="Logo DRAJ">
                    <h2>Bienvenido</h2>
                    <p class="subtitle">SISTC-DRAJ • Panel Administrativo</p>
                </div>
                
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-custom shadow-sm mb-4">
                                <i class="fas fa-exclamation-circle me-2"></i> {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}
                
                <form method="POST" action="{{ url_for('login') }}">
                    <div class="mb-4">
                        <label class="form-label">Usuario</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-user"></i></span>
                            <input type="text" class="form-control" name="username" required autofocus placeholder="Ingresa tu usuario">
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Contraseña</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-lock"></i></span>
                            <input type="password" class="form-control" name="password" required placeholder="Ingresa tu contraseña">
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-login w-100">
                        Iniciar Sesión
                    </button>
                    
                    <div class="text-center">
                        <a href="{{ url_for('solicitar') }}" class="back-link">
                            <i class="fas fa-arrow-left me-2" style="font-size:12px;"></i> Volver al Portal
                        </a>
                    </div>
                </form>
            </div>
        </div>

    </div>

    <!-- Scripts para el Océano 3D (Vanta.js) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.waves.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            if (window.innerWidth >= 992) {
                VANTA.WAVES({
                    el: "#vanta-ocean",
                    mouseControls: true,
                    touchControls: true,
                    gyroControls: false,
                    minHeight: 200.00,
                    minWidth: 200.00,
                    scale: 1.00,
                    scaleMobile: 1.00,
                    color: 0x074668,      /* Un tono de agua de mar / océano profundo */
                    shininess: 40.00,
                    waveHeight: 15.00,
                    waveSpeed: 0.60,
                    zoom: 1.1
                });
            }
        });
    </script>
</body>
</html>
