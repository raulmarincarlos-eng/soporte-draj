<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Soporte DRAJ</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #0b1115; /* Obsidian dark */
            overflow: hidden;
            position: relative;
        }

        /* Scales Canvas Background */
        #scalesCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Glowing overlay to add depth */
        .overlay-gradient {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, transparent 0%, #0b1115 100%);
            z-index: 2;
            pointer-events: none;
        }

        /* Glassmorphism Card Premium */
        .glass-card {
            background: rgba(16, 25, 33, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-top: 1px solid rgba(16, 185, 129, 0.5);
            border-radius: 20px;
            padding: 45px 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), 0 0 20px rgba(16, 185, 129, 0.1);
            z-index: 10;
            animation: slideUpFade 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(30px);
            position: relative;
        }

        /* Neon pulse behind card */
        .glass-card::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, #10b981, transparent, #0ea5e9);
            z-index: -1;
            border-radius: 22px;
            filter: blur(15px);
            opacity: 0.3;
            animation: pulseGlow 4s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { opacity: 0.2; filter: blur(15px); }
            100% { opacity: 0.4; filter: blur(20px); }
        }

        @keyframes slideUpFade {
            to { opacity: 1; transform: translateY(0); }
        }

        .login-header {
            text-align: center;
            margin-bottom: 35px;
        }
        .login-header img {
            width: 90px;
            height: auto;
            background: rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 25px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .login-header img:hover {
            transform: scale(1.1) translateY(-5px);
            border-color: rgba(16, 185, 129, 0.5);
            box-shadow: 0 15px 35px rgba(16, 185, 129, 0.2);
        }
        h2 {
            color: #f8fafc;
            font-weight: 800;
            letter-spacing: 1.5px;
            margin-bottom: 5px;
            font-size: 1.8rem;
        }
        p.subtitle {
            color: #94a3b8;
            font-size: 13px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* Inputs Premium */
        .input-group {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .input-group:focus-within {
            background: rgba(15, 23, 42, 0.9);
            border-color: #10b981;
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
        }
        .input-group-text {
            background: transparent;
            border: none;
            color: #10b981;
            padding-left: 20px;
        }
        .form-control {
            background: transparent;
            border: none;
            color: #f8fafc;
            padding: 16px 15px;
            font-size: 15px;
        }
        .form-control::placeholder {
            color: #64748b;
        }
        .form-control:focus {
            background: transparent;
            color: #f8fafc;
            box-shadow: none;
        }
        
        .form-label {
            color: #cbd5e1;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            margin-left: 5px;
        }

        /* Button Next-Level */
        .btn-login {
            background: linear-gradient(135deg, #059669 0%, #10b981 100%);
            border: 1px solid rgba(16, 185, 129, 0.4);
            border-radius: 14px;
            padding: 16px;
            font-weight: 800;
            font-size: 15px;
            letter-spacing: 2px;
            color: white;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.2);
        }
        .btn-login::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 60%);
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.5s ease;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(16, 185, 129, 0.4);
            background: linear-gradient(135deg, #047857 0%, #059669 100%);
        }
        .btn-login:hover::after {
            opacity: 1;
            transform: scale(1);
        }

        .back-link {
            color: #64748b;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
            display: inline-block;
            margin-top: 5px;
        }
        .back-link:hover {
            color: #f8fafc;
        }
        
        
        /* Tabs Premium */
        .auth-tabs {
            display: flex;
            background: rgba(15, 23, 42, 0.4);
            border-radius: 14px;
            padding: 5px;
            margin-bottom: 25px;
        }
        .auth-tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            color: #64748b;
            font-weight: 600;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.3s ease;
        }
        .auth-tab.active {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        
        .auth-form {
            display: none;
            animation: fadeInRight 0.4s ease forwards;
        }
        .auth-form.active {
            display: block;
        }
        @keyframes fadeInRight {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* Custom Alert */
        .alert-custom {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            border-radius: 12px;
            font-size: 14px;
            padding: 12px 15px;
        }
    </style>
</head>
<body>

    <canvas id="scalesCanvas"></canvas>
    <div class="overlay-gradient"></div>

    <div class="glass-card">
        <div class="login-header">
            <img src="{{ url_for('static', filename='img/logo_gore_junin.png') }}" alt="Logo">
            <h2>SISTC-DRAJ</h2>
            <p class="subtitle">Portal Unificado DRAJ</p>
        </div>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-custom shadow-sm mb-4">
                        <i class="fas fa-exclamation-circle me-2"></i> {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        

        <div class="auth-tabs">
            <div class="auth-tab active" onclick="switchTab('login')" id="tab-login">Ingresar</div>
            <div class="auth-tab" onclick="switchTab('register')" id="tab-register">Crear Cuenta</div>
        </div>

        <!-- FORMULARIO DE LOGIN -->
        <form method="POST" action="{{ url_for('login') }}" class="auth-form active" id="form-login">
            <div class="mb-4">
                <label class="form-label">DNI o Usuario Administrativo</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-user"></i></span>
                    <input type="text" class="form-control" name="username" required autofocus placeholder="Ingresa tu usuario o DNI">
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                    <input type="password" class="form-control" name="password" required placeholder="••••••••">
                </div>
            </div>
            <button type="submit" class="btn btn-login w-100 mt-2">
                Iniciar Sesión <i class="fas fa-arrow-right ms-2"></i>
            </button>
            <div class="text-center mt-4">
                <a href="{{ url_for('solicitar') }}" class="back-link small"><i class="fas fa-chevron-left me-1" style="font-size:10px;"></i> Portal de Solicitudes Públicas</a>
            </div>
        </form>

        <!-- FORMULARIO DE REGISTRO -->
        <form method="POST" action="{{ url_for('registro') }}" class="auth-form" id="form-register">
            <div class="mb-3">
                <label class="form-label">DNI (Será tu usuario)</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-id-card"></i></span>
                    <input type="text" class="form-control" name="dni" required placeholder="Ej. 76543210" pattern="[0-9]{8}">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Nombre Completo</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-user-circle"></i></span>
                    <input type="text" class="form-control" name="nombre" required placeholder="Nombres y Apellidos">
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label">Contraseña Segura</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-key"></i></span>
                    <input type="password" class="form-control" name="password" required placeholder="Mínimo 6 caracteres" minlength="6">
                </div>
            </div>
            <button type="submit" class="btn btn-login w-100 mt-2" style="background: linear-gradient(135deg, #2563eb 0%, #3b82f6 100%); border-color: #2563eb; box-shadow: 0 10px 20px rgba(59, 130, 246, 0.2);">
                Registrarme <i class="fas fa-user-plus ms-2"></i>
            </button>
        </form>

        <script>
            function switchTab(tab) {
                document.getElementById('tab-login').classList.remove('active');
                document.getElementById('tab-register').classList.remove('active');
                document.getElementById('form-login').classList.remove('active');
                document.getElementById('form-register').classList.remove('active');
                
                document.getElementById('tab-' + tab).classList.add('active');
                document.getElementById('form-' + tab).classList.add('active');
            }
        </script>

    </div>

    <!-- Advanced Geometric Scales Animation -->
    <script>
        const canvas = document.getElementById('scalesCanvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        const hexRadius = 40; 
        const hexHeight = hexRadius * Math.sqrt(3);
        const hexWidth = hexRadius * 2;
        
        let mouseX = -1000;
        let mouseY = -1000;
        
        // Resize handler
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Mouse tracking
        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });
        window.addEventListener('mouseout', () => {
            mouseX = -1000;
            mouseY = -1000;
        });

        // Draw a single hexagon
        function drawHexagon(x, y, distToMouse, time) {
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const angle = (Math.PI / 180) * (60 * i - 30);
                const px = x + hexRadius * Math.cos(angle);
                const py = y + hexRadius * Math.sin(angle);
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();

            // Base colors (Dark Corporate)
            let strokeColor = 'rgba(16, 185, 129, 0.05)';
            let fillColor = 'rgba(11, 17, 21, 0.8)';
            let lineWidth = 1;

            // Interactive glowing effect based on mouse distance
            if (distToMouse < 250) {
                const intensity = 1 - (distToMouse / 250);
                strokeColor = `rgba(16, 185, 129, ${0.05 + intensity * 0.4})`;
                fillColor = `rgba(16, 185, 129, ${intensity * 0.08})`;
                lineWidth = 1 + intensity * 1.5;
            }

            // Subtle pulsing animation wave
            const wave = Math.sin((x * y) / 10000 + time) * 0.5 + 0.5;
            if (distToMouse >= 250) {
                strokeColor = `rgba(16, 185, 129, ${0.02 + wave * 0.05})`;
            }

            ctx.fillStyle = fillColor;
            ctx.strokeStyle = strokeColor;
            ctx.lineWidth = lineWidth;
            ctx.fill();
            ctx.stroke();
        }

        // Main animation loop
        function animate(timestamp) {
            ctx.clearRect(0, 0, width, height);
            
            const time = timestamp * 0.001;
            
            // Draw grid of overlapping "scales" (hexagons)
            const cols = Math.ceil(width / (hexWidth * 0.75)) + 4;
            const rows = Math.ceil(height / hexHeight) + 4;
            
            // Continuous travel offset
            const speed = 40; // Pixels per second
            const xTravel = (time * speed) % (hexWidth * 0.75 * 2);
            const yTravel = (time * speed * 0.5) % (hexHeight * 2);
            
            for (let c = -2; c < cols; c++) {
                for (let r = -2; r < rows; r++) {
                    // Offset odd columns to create interlocking scale pattern
                    let x = c * hexWidth * 0.75 - xTravel;
                    let y = r * hexHeight + (c % 2 === 0 ? 0 : hexHeight / 2) - yTravel;
                    
                    // Add slight floating movement
                    const floatY = Math.sin(time + x/200) * 5;
                    y += floatY;

                    const dx = mouseX - x;
                    const dy = mouseY - y;
                    const distToMouse = Math.sqrt(dx * dx + dy * dy);
                    
                    drawHexagon(x, y, distToMouse, time);
                }
            }
            
            requestAnimationFrame(animate);
        }
        
        requestAnimationFrame(animate);
    </script>
</body>
</html>
