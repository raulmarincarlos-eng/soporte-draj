{% extends 'base.html' %}

{% block content %}
<style>
    body {
        background: linear-gradient(135deg, #e0f2e9 0%, #f4f7f6 100%);
        padding-bottom: 50px;
    }
    
    /* WIDGET DEL ROBOT FIJO */
    #robot-widget {
        position: fixed;
        bottom: 30px;
        left: 30px;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    #robot-widget:hover {
        transform: scale(1.1);
        cursor: pointer;
    }
    
    /* AVATAR CIRCULAR */
    .robot-avatar {
        width: 140px;
        height: 140px;
        border-radius: 50%;
        object-fit: cover;
        border: 5px solid #fff;
        box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        animation: float-avatar 3s ease-in-out infinite;
        background: #fff;
    }
    @keyframes float-avatar {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0px); }
    }
    
    /* BURBUJA DE CHAT ESTILO GAMER */
    .speech-bubble {
        background: #fff;
        border-radius: 20px 20px 20px 0;
        padding: 15px 20px;
        border-left: 5px solid #198754;
        box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        max-width: 280px;
        margin-bottom: 15px;
        animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        opacity: 0;
        transform: scale(0.5);
        transform-origin: bottom left;
    }
    @keyframes popIn {
        to { opacity: 1; transform: scale(1); }
    }

    /* ONDAS DE SONIDO ANIMADAS (Cuando habla) */
    .sound-waves {
        display: inline-flex;
        align-items: flex-end;
        height: 15px;
        gap: 3px;
        margin-left: 10px;
        display: none; /* Oculto por defecto */
    }
    .sound-waves .bar {
        width: 4px;
        background-color: #198754;
        animation: sound 0ms -800ms linear infinite alternate;
    }
    .sound-waves .bar:nth-child(1) { height: 4px; animation-duration: 474ms; }
    .sound-waves .bar:nth-child(2) { height: 10px; animation-duration: 433ms; }
    .sound-waves .bar:nth-child(3) { height: 15px; animation-duration: 407ms; }
    .sound-waves .bar:nth-child(4) { height: 8px; animation-duration: 458ms; }
    @keyframes sound {
        0% { height: 3px; opacity: 0.5; }
        100% { height: 15px; opacity: 1; }
    }

    /* ESTILOS DEL FORMULARIO Y GLASSMORPHISM */
    .glass-card {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.5);
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 25px 45px rgba(0,0,0,0.1);
    }
    
    /* FLOATING LABELS MEJORADOS */
    .form-floating > .form-control,
    .form-floating > .form-select {
        border-radius: 12px;
        border: 2px solid transparent;
        background-color: rgba(255, 255, 255, 0.9);
        box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .form-floating > .form-control:focus,
    .form-floating > .form-select:focus {
        border-color: #198754;
        background-color: #fff;
        box-shadow: 0 0 0 4px rgba(25, 135, 84, 0.15);
    }
    .form-floating > label {
        color: #6c757d;
        font-weight: 500;
        padding-left: 1.25rem;
    }
    
    /* SEPARADORES CON ÍCONOS */
    .section-divider {
        display: flex;
        align-items: center;
        margin: 2rem 0 1.5rem;
    }
    .section-divider::after {
        content: "";
        flex: 1;
        height: 2px;
        background: linear-gradient(90deg, #19875422 0%, transparent 100%);
        margin-left: 15px;
        border-radius: 2px;
    }
    .section-icon {
        background: linear-gradient(135deg, #198754 0%, #20c997 100%);
        color: white;
        width: 35px;
        height: 35px;
        border-radius: 10px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-right: 12px;
        box-shadow: 0 4px 10px rgba(25,135,84,0.3);
    }
    
    /* BOTÓN GLOWING */
    .btn-glowing {
        background: linear-gradient(135deg, #198754 0%, #20c997 100%);
        border: none;
        position: relative;
        overflow: hidden;
        z-index: 1;
        transition: all 0.3s;
    }
    .btn-glowing::before {
        content: '';
        position: absolute;
        top: -2px; left: -2px; right: -2px; bottom: -2px;
        background: inherit;
        filter: blur(15px);
        opacity: 0.6;
        z-index: -1;
        animation: pulse-glow 2s infinite alternate;
    }
    @keyframes pulse-glow {
        0% { opacity: 0.4; transform: scale(0.95); }
        100% { opacity: 0.8; transform: scale(1.05); }
    }
    .btn-glowing:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(25, 135, 84, 0.4);
    }
    .bg-draj { background-color: #198754; }
</style>

<div class="container mt-4 mb-5">
    <div class="row justify-content-center">
        <!-- FORMULARIO CENTRADO -->
        <div class="col-lg-8">
            <div class="glass-card fade-in" style="animation-delay: 0.1s;">
                <div class="bg-draj text-white p-4 p-md-5" style="background: linear-gradient(135deg, #198754 0%, #146c43 100%);">
                    <div class="d-flex align-items-center">
                        <div class="bg-white text-success rounded-circle d-flex justify-content-center align-items-center me-4 shadow-lg" style="width: 65px; height: 65px;">
                            <i class="fas fa-headset fa-2x"></i>
                        </div>
                        <div>
                            <h3 class="mb-1 fw-bold" style="letter-spacing: -0.5px;">Solicitar Soporte Técnico</h3>
                            <p class="mb-0 text-white-50 fs-6">Dirección Regional de Agricultura Junín</p>
                        </div>
                    </div>
                </div>
                
                <div class="p-4 p-md-5">
                    <form method="POST" action="{{ url_for('solicitar') }}" id="form-solicitud">
                        
                        <!-- SECCIÓN 1: TUS DATOS -->
                        <div class="section-divider mt-0">
                            <div class="section-icon"><i class="fas fa-user"></i></div>
                            <h5 class="mb-0 fw-bold text-dark">Tus Datos</h5>
                        </div>
                        <div class="row g-4">
                            <div class="col-md-6">
                                <div class="form-floating">
                                    <input type="text" class="form-control" id="nombre_solicitante" name="nombre_solicitante" required placeholder="Ej: Juan Pérez">
                                    <label for="nombre_solicitante">Nombre Solicitante *</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-floating">
                                    <input type="text" class="form-control" id="contacto" name="contacto" required placeholder="Ej: Anexo 102 o Celular">
                                    <label for="contacto">Celular / Anexo *</label>
                                </div>
                            </div>
                        </div>

                        <!-- SECCIÓN 2: TU UBICACIÓN -->
                        <div class="section-divider">
                            <div class="section-icon"><i class="fas fa-map-marker-alt"></i></div>
                            <h5 class="mb-0 fw-bold text-dark">Tu Ubicación</h5>
                        </div>
                        <div class="row g-4">
                            <div class="col-md-6">
                                <div class="form-floating">
                                    <select class="form-select text-uppercase" name="direccion" id="direccion" required onchange="actualizarSubAreas()">
                                        <option value="">Seleccione...</option>
                                    </select>
                                    <label for="direccion">Dirección / Agencia *</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-floating">
                                    <select class="form-select" name="sub_area" id="sub_area">
                                        <option value="">Seleccione la Dirección primero...</option>
                                    </select>
                                    <label for="sub_area">Oficina Específica</label>
                                </div>
                            </div>
                        </div>

                        <!-- SECCIÓN 3: EL REQUERIMIENTO -->
                        <div class="section-divider">
                            <div class="section-icon" style="background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);"><i class="fas fa-tools"></i></div>
                            <h5 class="mb-0 fw-bold text-dark">El Requerimiento</h5>
                        </div>
                        <div class="row g-4">
                            <div class="col-md-6">
                                <div class="form-floating">
                                    <select class="form-select" name="tipo_atencion" id="tipo_atencion" required>
                                        <option value="">Seleccione...</option>
                                        <option value="Incidencia">Incidencia (Problema/Falla)</option>
                                        <option value="Requerimiento">Requerimiento (Nuevo servicio)</option>
                                        <option value="Otros">Otros</option>
                                    </select>
                                    <label for="tipo_atencion">Tipo de Atención *</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-floating">
                                    <input type="text" class="form-control" id="equipo" name="equipo" placeholder="Ej: 123 456 789">
                                    <label for="equipo">PC / AnyDesk (Opcional)</label>
                                </div>
                            </div>
                            <div class="col-12">
                                <div class="form-floating">
                                    <textarea class="form-control" id="descripcion" name="descripcion" style="height: 120px" required placeholder="Describa el problema con su equipo o sistema aquí..."></textarea>
                                    <label for="descripcion">Descripción Detallada del Problema *</label>
                                </div>
                            </div>
                        </div>
                        
                        <div class="mt-5 pt-4 border-top d-flex justify-content-end">
                            <button type="submit" id="btn-submit" class="btn btn-glowing btn-lg px-5 rounded-pill fw-bold text-white shadow-lg">
                                <span id="btn-text">Enviar Solicitud</span> <i class="fas fa-paper-plane ms-2" id="btn-icon"></i>
                                <span class="spinner-border spinner-border-sm ms-2 d-none" id="btn-spinner" role="status" aria-hidden="true"></span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// Animación del botón al enviar
document.getElementById('form-solicitud').addEventListener('submit', function() {
    const btn = document.getElementById('btn-submit');
    const text = document.getElementById('btn-text');
    const icon = document.getElementById('btn-icon');
    const spinner = document.getElementById('btn-spinner');
    
    btn.classList.add('disabled');
    text.textContent = 'Enviando...';
    icon.classList.add('d-none');
    spinner.classList.remove('d-none');
});
</script>

<!-- WIDGET DEL ROBOT FIJO (Esquina Inferior Izquierda) -->
<div id="robot-widget" class="d-none d-md-flex">
    <div class="speech-bubble">
        <h6 class="fw-bold text-success mb-1 d-flex align-items-center">
            <i class="fas fa-robot me-2"></i>Tech-E dice:
            <div class="sound-waves" id="sound-waves">
                <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
            </div>
        </h6>
        <p id="robot-text" class="mb-0 text-dark fw-medium" style="font-size: 0.9rem; line-height: 1.4;"></p>
    </div>
    <img src="{{ url_for('static', filename='img/robot.jpg') }}" alt="Robot Soporte" class="robot-avatar" id="robot-img">
</div>

<!-- SCRIPT PARA EL ROBOT -->
<script>
document.addEventListener("DOMContentLoaded", function() {
    const textToType = "¡Hola! Bienvenido al Soporte TI. Haz clic en el formulario para empezar, te ayudaremos pronto.";
    const typingElement = document.getElementById('robot-text');
    const soundWaves = document.getElementById('sound-waves');
    let i = 0;
    
    // Efecto máquina de escribir
    function typeWriter() {
        if (i < textToType.length) {
            typingElement.innerHTML += textToType.charAt(i);
            i++;
            setTimeout(typeWriter, 30);
        }
    }
    setTimeout(typeWriter, 800); // Iniciar texto un poco después

    // Sistema de Voz Interactivo por Hover
    const robotWidget = document.getElementById('robot-widget');
    let interacciones = 0;
    
    const frasesAdicionales = [
        "Estamos a su entera disposición.",
        "Por favor, detalle su problema para brindarle una solución más rápida.",
        "No olvide anotar el número de ticket generado para consultar su estado luego.",
        "El equipo de Informática está procesando las solicitudes, pronto le ayudaremos."
    ];

    function hablar() {
        if ('speechSynthesis' in window) {
            // Cancelamos audios anteriores por si pasa el mouse repetidamente
            window.speechSynthesis.cancel();
            
            soundWaves.style.display = 'inline-flex';
            
            let mensaje = "";
            if (interacciones === 0) {
                mensaje = "Hola. Bienvenido al Soporte de Tecnologías. Registra tu solicitud y la atenderemos lo más pronto posible.";
            } else {
                const indexRandom = Math.floor(Math.random() * frasesAdicionales.length);
                mensaje = frasesAdicionales[indexRandom];
            }
            
            const utterance = new SpeechSynthesisUtterance(mensaje);
            utterance.lang = 'es-ES';
            utterance.pitch = 1.3; // Tono robótico
            utterance.rate = 1.05;
            
            utterance.onend = function() {
                soundWaves.style.display = 'none';
            };
            
            window.speechSynthesis.speak(utterance);
            interacciones++;
        }
    }

    // Activar cuando pasa el ratón (hover) sobre el widget
    robotWidget.addEventListener('mouseenter', hablar);
    
    // Y para celulares, activarlo al tocarlo
    robotWidget.addEventListener('touchstart', (e) => {
        e.preventDefault(); // Evitar comportamientos por defecto
        hablar();
    });
});
</script>

<script>
    const subAreas = {
        "Dirección Regional": ["Imagen Institucional"],
        "Dir. de Forestales, Fauna Silvestre y Asuntos Ambientales": [],
        "Dir. Estadística e Información Agraria": ["Área Administrativa", "Estadísticas Agrícolas", "Estadísticas Pecuarias", "Área Informática"],
        "Dir. Desarrollo Agropecuario": ["Área Administrativa", "Unidad de Cultivos", "Unidad de Crianzas", "Unidad de Ferias Agropecuarias", "Unidad de Camélidos Sudamericanos"],
        "Dir. Titulación de Tierras y Catastro Rural": ["Área Administrativa", "Atención al Usuario", "Unidad de Comunidades Campesinas y Nativas", "Unidad de Predios Rurales - Saneamiento Físico", "Unidad de Predios Rurales - Saneamiento Legal", "Área de Segundos Actos - Saneamiento Físico", "Unidad de Sistemas, Catastro y Archivo"],
        "Oficina de Administración": ["Control Previo", "Área de Gestión de RRHH", "Coord. de Bienestar Social", "Coord. de Control de Personal", "Coord. de Registro y Escalafón", "Coord. de Registro y Reconocimiento", "Coord. de Remuneraciones"],
        "Oficina de Logística": ["Coord. de Almacén", "Coord. de Archivo Central", "Coord. de Patrimonio", "Trámite Documentario", "Coord. de Programa de Maquinaria Agrícola e Industria Pesada", "Coord. de Vigilancia", "Secretaría Técnica de Proc. Admin. Disciplinarios"],
        "Oficina de Tesorería": ["Coord. de Pagaduría", "Coord. de Recaudación"],
        "Oficina de Planeamiento, Presupuesto y Modernización": ["Área de Gestión Operativa y Estratégica", "Área de Inversiones y Coop. Técnica Internacional", "Área de Organización y Modernización", "Área de Presupuesto"],
        "Oficina de Asesoría Jurídica": ["Área de Asuntos Administrativos", "Área de Asuntos Contenciosos"],
        "Agencias Agrarias y Oficinas Remotas": ["Agencia Agraria Chanchamayo", "Agencia Agraria Chupaca", "Agencia Agraria Concepción", "Agencia Agraria Jauja", "Agencia Agraria Junín", "Agencia Agraria Tarma", "Agencia Agraria Satipo", "Agencia Agraria Yauli - La Oroya", "Oficina Agraria Sapallanga"]
    };

    document.addEventListener("DOMContentLoaded", function() {
        const dirSelect = document.getElementById("direccion");
        for (let dir in subAreas) {
            let option = document.createElement("option");
            option.value = dir;
            option.text = dir;
            dirSelect.add(option);
        }
    });

    function actualizarSubAreas() {
        const direccion = document.getElementById("direccion").value;
        const subAreaSelect = document.getElementById("sub_area");
        
        subAreaSelect.innerHTML = '<option value="">Seleccione Oficina...</option>';
        
        if (direccion && subAreas[direccion] && subAreas[direccion].length > 0) {
            subAreas[direccion].forEach(area => {
                let option = document.createElement("option");
                option.value = area;
                option.text = area;
                subAreaSelect.add(option);
            });
        }
    }
</script>
{% endblock %}
