{% extends 'base.html' %}

{% block content %}
<style>
    body {
        background: linear-gradient(135deg, #e0f2e9 0%, #f4f7f6 100%);
        padding-bottom: 50px;
    }
    
    /* WIDGET DEL ROBOT FIJO */
    #robot-widget {
        position: fixed;
        top: 15vh;
        right: 30px;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        filter: drop-shadow(0 10px 15px rgba(0,0,0,0.1));
    }
    #robot-widget:hover {
        transform: scale(1.05);
        cursor: pointer;
    }
    
    /* AVATAR 3D DEL ROBOT */
    .robot-avatar {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255,255,255,1) 0%, rgba(240,248,245,1) 100%);
        box-shadow: 0 15px 35px rgba(25, 135, 84, 0.4), 0 0 20px rgba(25, 135, 84, 0.2);
        animation: float-avatar 4s ease-in-out infinite, pulse-glow 3s infinite alternate;
        cursor: pointer;
        display: block;
        overflow: hidden;
        border: 4px solid #fff;
    }
    @keyframes pulse-glow {
        0% { box-shadow: 0 15px 35px rgba(25, 135, 84, 0.4), 0 0 20px rgba(25, 135, 84, 0.2); }
        100% { box-shadow: 0 15px 35px rgba(25, 135, 84, 0.7), 0 0 40px rgba(25, 135, 84, 0.5); }
    }
    @keyframes float-avatar {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
    }
    .speech-bubble {
        background: #fff;
        border-radius: 20px 0 20px 20px;
        padding: 15px 20px;
        border-left: 5px solid #198754;
        box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        max-width: 280px;
        margin-top: 15px;
        animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        opacity: 0;
        transform: scale(0.5);
        transform-origin: top right;
        transition: max-height 0.4s cubic-bezier(0, 1, 0.5, 1), padding 0.4s ease, opacity 0.3s;
        max-height: 500px;
        overflow: hidden;
    }
    .speech-bubble.collapsed {
        max-height: 0;
        padding-top: 0;
        padding-bottom: 0;
        margin-top: 0;
        opacity: 0;
        border: none;
    }
    @keyframes popIn {
        to { opacity: 1; transform: scale(1); }
    }
    
    /* ANIMACION ESCRIBIENDO */
    .typing-indicator {
        display: none;
        align-items: center;
        padding: 5px 10px;
        background: #e9ecef;
        border-radius: 10px;
        width: fit-content;
        margin-bottom: 10px;
    }
    .typing-indicator span {
        height: 6px;
        width: 6px;
        background: #198754;
        border-radius: 50%;
        display: inline-block;
        margin-right: 4px;
        animation: typingBounce 1.4s infinite ease-in-out both;
    }
    .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
    .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
    @keyframes typingBounce {
        0%, 80%, 100% { transform: scale(0); }
        40% { transform: scale(1); }
    }
    
    /* ANIMACIONES DEL ROBOT */
    .robot-breathing {
        animation: breathing 4s ease-in-out infinite;
    }
    .robot-talking {
        animation: talking 0.3s ease-in-out infinite alternate, glow 1.5s ease-in-out infinite alternate;
    }
    .robot-happy {
        animation: happyJump 0.6s ease-in-out 2;
    }
    @keyframes breathing {
        0% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-5px) scale(1.02); }
        100% { transform: translateY(0) scale(1); }
    }
    @keyframes talking {
        from { transform: scale(1); }
        to { transform: scale(1.05) skewX(2deg); }
    }
    @keyframes glow {
        from { box-shadow: 0 0 10px rgba(25,135,84,0.5); }
        to { box-shadow: 0 0 25px rgba(25,135,84,1); }
    }
    @keyframes happyJump {
        0% { transform: translateY(0); }
        50% { transform: translateY(-20px) rotate(5deg); }
        100% { transform: translateY(0); }
    }
    .chat-history {
        max-height: 150px;
        overflow-y: auto;
        padding-right: 5px;
        scrollbar-width: thin;
        scrollbar-color: #198754 transparent;
    }

    /* ROBOT MOBILE RESPONSIVE */
    @media (max-width: 768px) {
        #robot-widget {
            bottom: 15px;
            left: 15px;
        }
        .robot-avatar {
            width: 80px;
            height: 80px;
            border-width: 3px;
        }
        .speech-bubble {
            padding: 10px 15px;
            font-size: 0.85rem;
            max-width: 200px;
            margin-bottom: 10px;
        }
    }

    /* ONDAS DE SONIDO ANIMADAS (Cuando habla) */
    .sound-waves {
        display: inline-flex;
        align-items: flex-end;
        height: 15px;
        gap: 3px;
        margin-left: 10px;
        display: none; /* Oculto por defecto */
    }
    .sound-waves .bar {
        width: 4px;
        background-color: #198754;
        animation: sound 0ms -800ms linear infinite alternate;
    }
    .sound-waves .bar:nth-child(1) { height: 4px; animation-duration: 474ms; }
    .sound-waves .bar:nth-child(2) { height: 10px; animation-duration: 433ms; }
    .sound-waves .bar:nth-child(3) { height: 15px; animation-duration: 407ms; }
    .sound-waves .bar:nth-child(4) { height: 8px; animation-duration: 458ms; }
    @keyframes sound {
        0% { height: 3px; opacity: 0.5; }
        100% { height: 15px; opacity: 1; }
    }

    /* ESTILOS DEL FORMULARIO Y GLASSMORPHISM */
    .glass-card {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.5);
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 25px 45px rgba(0,0,0,0.1);
    }
    
    /* FLOATING LABELS MEJORADOS */
    .form-floating > .form-control,
    .form-floating > .form-select {
        border-radius: 12px;
        border: 2px solid transparent;
        background-color: rgba(255, 255, 255, 0.9);
        box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .form-floating > .form-control:focus,
    .form-floating > .form-select:focus {
        border-color: #198754;
        background-color: #fff;
        box-shadow: 0 0 0 4px rgba(25, 135, 84, 0.15);
    }
    .form-floating > label {
        color: #6c757d;
        font-weight: 500;
        padding-left: 1.25rem;
    }
    
    /* SEPARADORES CON ÍCONOS */
    .section-divider {
        display: flex;
        align-items: center;
        margin: 2rem 0 1.5rem;
    }
    .section-divider::after {
        content: "";
        flex: 1;
        height: 2px;
        background: linear-gradient(90deg, #19875422 0%, transparent 100%);
        margin-left: 15px;
        border-radius: 2px;
    }
    .section-icon {
        background: linear-gradient(135deg, #198754 0%, #20c997 100%);
        color: white;
        width: 35px;
        height: 35px;
        border-radius: 10px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-right: 12px;
        box-shadow: 0 4px 10px rgba(25,135,84,0.3);
    }
    
    /* BOTÓN GLOWING */
    .btn-glowing {
        background: linear-gradient(135deg, #198754 0%, #20c997 100%);
        border: none;
        position: relative;
        overflow: hidden;
        z-index: 1;
        transition: all 0.3s;
    }
    .btn-glowing::before {
        content: '';
        position: absolute;
        top: -2px; left: -2px; right: -2px; bottom: -2px;
        background: inherit;
        filter: blur(15px);
        opacity: 0.6;
        z-index: -1;
        animation: pulse-glow 2s infinite alternate;
    }
    @keyframes pulse-glow {
        0% { opacity: 0.4; transform: scale(0.95); }
        100% { opacity: 0.8; transform: scale(1.05); }
    }
    .btn-glowing:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(25, 135, 84, 0.4);
    }
    .bg-draj { background-color: #198754; }
</style>

    <div class="row justify-content-center">
        <!-- FORMULARIO CENTRADO -->
        <div class="col-lg-8">
            <div class="glass-card fade-in" style="animation-delay: 0.1s;">
                <div class="bg-draj text-white p-4 p-md-5" style="background: linear-gradient(135deg, #198754 0%, #146c43 100%);">
                    <div class="d-flex align-items-center">
                        <div class="bg-white text-success rounded-circle d-flex justify-content-center align-items-center me-4 shadow-lg" style="width: 65px; height: 65px;">
                            <i class="fas fa-headset fa-2x"></i>
                        </div>
                        <div>
                            <h3 class="mb-1 fw-bold" style="letter-spacing: -0.5px;">Solicitar Soporte Técnico</h3>
                            <p class="mb-0 text-white-50 fs-6">Dirección Regional de Agricultura Junín</p>
                        </div>
                    </div>
                </div>
                
                <div class="p-4 p-md-5">
                    <form method="POST" action="{{ url_for('solicitar') }}" id="form-solicitud">
                        
                        <!-- SECCIÓN 1: TUS DATOS -->
                        <div class="section-divider mt-0">
                            <div class="section-icon"><i class="fas fa-user"></i></div>
                            <h5 class="mb-0 fw-bold text-dark">Tus Datos</h5>

                        <div class="row g-4">
                            <div class="col-md-6">
                                <div class="form-floating">
                                    <input type="text" class="form-control" id="nombre_solicitante" name="nombre_solicitante" required placeholder="Ej: Juan Pérez">
                                    <label for="nombre_solicitante">Nombre Solicitante *</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-floating">
                                    <input type="text" class="form-control" id="contacto" name="contacto" required placeholder="Ej: Anexo 102 o Celular">
                                    <label for="contacto">Celular / Anexo *</label>
                                </div>
                            </div>
                        </div>

                        <!-- SECCIÓN 2: TU UBICACIÓN -->
                        <div class="section-divider">
                            <div class="section-icon"><i class="fas fa-map-marker-alt"></i></div>
                            <h5 class="mb-0 fw-bold text-dark">Tu Ubicación</h5>
                        </div>
                        <div class="row g-4">
                            <div class="col-md-6">
                                <div class="form-floating">
                                    <select class="form-select text-uppercase" name="direccion" id="direccion" required onchange="actualizarSubAreas()">
                                        <option value="">Seleccione...</option>
                                    </select>
                                    <label for="direccion">Dirección / Agencia *</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-floating">
                                    <select class="form-select" name="sub_area" id="sub_area">
                                        <option value="">Seleccione la Dirección primero...</option>
                                    </select>
                                    <label for="sub_area">Oficina Específica</label>
                                </div>
                            </div>
                        </div>

                        <!-- SECCIÓN 3: EL REQUERIMIENTO -->
                        <div class="section-divider">
                            <div class="section-icon" style="background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);"><i class="fas fa-tools"></i></div>
                            <h5 class="mb-0 fw-bold text-dark">El Requerimiento</h5>
                        </div>
                        <div class="row g-4">
                            <div class="col-md-6">
                                <div class="form-floating">
                                    <select class="form-select" name="tipo_atencion" id="tipo_atencion" required>
                                        <option value="">Seleccione...</option>
                                        <option value="Incidencia">Incidencia (Problema/Falla)</option>
                                        <option value="Requerimiento">Requerimiento (Nuevo servicio)</option>
                                        <option value="Otros">Otros</option>
                                    </select>
                                    <label for="tipo_atencion">Tipo de Atención *</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-floating">
                                    <input type="text" class="form-control" id="equipo" name="equipo" placeholder="Ej: 123 456 789">
                                    <label for="equipo">PC / AnyDesk (Opcional)</label>
                                </div>
                            </div>
                            <div class="col-12">
                                <div class="form-floating">
                                    <textarea class="form-control" id="descripcion" name="descripcion" style="height: 120px" required placeholder="Describa el problema con su equipo o sistema aquí..."></textarea>
                                    <label for="descripcion">Descripción Detallada del Problema *</label>
                                </div>
                            </div>
                        </div>
                        
                        <div class="mt-5 pt-4 border-top d-flex justify-content-end">
                            <button type="submit" id="btn-submit" class="btn btn-glowing btn-lg px-5 rounded-pill fw-bold text-white shadow-lg">
                                <span id="btn-text">Enviar Solicitud</span> <i class="fas fa-paper-plane ms-2" id="btn-icon"></i>
                                <span class="spinner-border spinner-border-sm ms-2 d-none" id="btn-spinner" role="status" aria-hidden="true"></span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>

<!-- WIDGET DEL ROBOT FIJO (Interactivo 2.0) -->
<div id="robot-widget">
    <img src="{{ url_for('static', filename='img/robot.jpg') }}" alt="Robot Soporte" class="robot-avatar" id="robot-img" style="cursor: pointer;" onclick="toggleFAQ()">
    <div class="speech-bubble" id="robot-bubble">

            <button class="btn btn-sm btn-outline-success w-100 mb-1 rounded-pill faq-btn text-start fw-bold" onclick="responderFAQ('tinta')"><i class="fas fa-magic me-1"></i> Falta Tinta o Tóner</button>

<!-- SCRIPT PARA EL ROBOT INTERACTIVO 2.0 CON FLUIDEZ -->
<script>
    const chatHistory = document.getElementById('chat-history');
    const soundWaves = document.getElementById('sound-waves');
    const faqButtons = document.getElementById('faq-buttons');
    const robotImg = document.getElementById('robot-img');

    // 3D Parallax Effect para hacer que la imagen "mire" al cursor
    document.addEventListener('mousemove', (e) => {
        if (!robotImg) return;
        const rect = robotImg.getBoundingClientRect();
        const x = rect.left + rect.width / 2;
        const y = rect.top + rect.height / 2;
        
        // Calcular diferencia entre mouse y centro de la imagen
        const deltaX = e.clientX - x;
        const deltaY = e.clientY - y;
        
        // Limitar la rotación para que no sea extrema (max 15 grados)
        const rotateX = Math.max(-15, Math.min(15, -deltaY / 20));
        const rotateY = Math.max(-15, Math.min(15, deltaX / 20));
        
        robotImg.style.transform = `perspective(500px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.05)`;
    });
    
    // Resetear al salir el mouse de la pantalla
    document.addEventListener('mouseleave', () => {
        if (robotImg) robotImg.style.transform = `perspective(500px) rotateX(0deg) rotateY(0deg) scale(1)`;
    });
    const btnMute = document.getElementById('btn-mute');
    const robotBubble = document.getElementById('robot-bubble');
    const typingIndicator = document.getElementById('typing-indicator');
    
    let isMuted = false;
    
    // SFX Engine (Web Audio API) - Sin archivos externos
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;
    function playSFX(type) {
        if (isMuted) return;
        if (!audioCtx) audioCtx = new AudioContext();
        
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        if (type === 'pop') {
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(600, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.1);
        } else if (type === 'bloop') {
            oscillator.type = 'triangle';
            oscillator.frequency.setValueAtTime(300, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.2);
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.2);
        }
    }

    // Diccionario de respuestas FAQ
    const respuestasFAQ = {
        'internet': "Si no tienes Internet, revisa que el cable amarillo esté bien conectado. Si el problema persiste, llena el formulario eligiendo 'Red/Internet'.",
        'tinta': "¡Magia activada! He rellenado el formulario por ti. Recuerda poner el <b>modelo de tu impresora</b> en la descripción.",
        'pc': "Asegúrate de que el estabilizador esté encendido y enchufado. Si la luz no prende, solicita soporte eligiendo 'Hardware'."
    };

    let vocesAmigables = [];
    window.speechSynthesis.onvoiceschanged = function() {
        vocesAmigables = window.speechSynthesis.getVoices().filter(voice => voice.lang.includes('es'));
    };

    function appendMessage(mensaje) {
        const msgDiv = document.createElement('div');
        msgDiv.className = 'mb-2 text-dark fw-medium bg-light rounded p-2 small border fade-in';
        msgDiv.style.borderLeft = "4px solid #198754 !important";
        msgDiv.innerHTML = mensaje;
        chatHistory.insertBefore(msgDiv, typingIndicator); // Insertar antes del indicador de tipeo
        chatHistory.scrollTop = chatHistory.scrollHeight;
    }

    function hablarTexto(mensaje, autoFillAction = null) {
        // Mostrar indicador de "Escribiendo..."
        typingIndicator.style.display = 'flex';
        chatHistory.scrollTop = chatHistory.scrollHeight;
        
        // Simular retraso humano (1 segundo)
        setTimeout(() => {
            typingIndicator.style.display = 'none';
            playSFX('pop');
            appendMessage(mensaje);
            
            if (!isMuted && 'speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                soundWaves.style.display = 'inline-flex';
                robotImg.classList.remove('robot-breathing');
                robotImg.classList.add('robot-talking');
                
                const textoLimpio = mensaje.replace(/<[^>]*>?/gm, ''); // Quitar tags HTML
                const utterance = new SpeechSynthesisUtterance(textoLimpio);
                utterance.lang = 'es-MX';
                utterance.pitch = 1.1;
                utterance.rate = 1.0;
                
                if (vocesAmigables.length === 0) vocesAmigables = window.speechSynthesis.getVoices().filter(v => v.lang.includes('es'));
                const vozIdeal = vocesAmigables.find(v => v.name.includes('Google') || v.name.includes('Sabina') || v.name.includes('Mia') || v.name.includes('Paulina'));
                if (vozIdeal) utterance.voice = vozIdeal;
                
                utterance.onend = function() { 
                    soundWaves.style.display = 'none'; 
                    robotImg.classList.remove('robot-talking');
                    robotImg.classList.add('robot-breathing');
                };
                window.speechSynthesis.speak(utterance);
            }
            
            if (autoFillAction === 'tinta') {
                document.getElementById('tipo_atencion').value = 'Requerimiento';
                document.getElementById('descripcion').value = 'Requerimiento de Tinta/Tóner. Modelo de la impresora: ';
                document.getElementById('clasif_hardware').checked = true;
                document.getElementById('descripcion').focus();
            }
        }, 1000); // 1 sec delay
    }

    function toggleMute() {
        isMuted = !isMuted;
        if (isMuted) {
            window.speechSynthesis.cancel();
            btnMute.innerHTML = '<i class="fas fa-volume-mute text-danger"></i>';
            soundWaves.style.display = 'none';
            robotImg.classList.remove('robot-talking');
            robotImg.classList.add('robot-breathing');
        } else {
            btnMute.innerHTML = '<i class="fas fa-volume-up"></i>';
            playSFX('pop');
        }
    }

    function collapseChat() {
        playSFX('bloop');
        robotBubble.classList.add('collapsed');
    }

    function toggleFAQ() {
        if (robotBubble.classList.contains('collapsed')) {
            playSFX('bloop');
            robotBubble.classList.remove('collapsed');
            if (faqButtons.classList.contains('d-none')) {
                faqButtons.classList.remove('d-none');
            }
        } else {
            if (faqButtons.classList.contains('d-none')) {
                playSFX('bloop');
                faqButtons.classList.remove('d-none');
            } else {
                collapseChat();
            }
        }
    }

    function responderFAQ(tema) {
        hablarTexto(respuestasFAQ[tema], tema);
    }

    function mostrarTracker() {
        playSFX('bloop');
        const tf = document.getElementById('tracker-form');
        if (tf.classList.contains('d-none')) {
            tf.classList.remove('d-none');
            hablarTexto("Por favor, ingresa tu número de ticket en la cajita que acaba de aparecer.");
            document.getElementById('tracker-input').focus();
        } else {
            tf.classList.add('d-none');
        }
    }

    function rastrearTicket() {
        const input = document.getElementById('tracker-input');
        const val = input.value.trim();
        if (!val) {
            hablarTexto("No has ingresado ningún código. Intenta de nuevo.");
            return;
        }
        
        hablarTexto("Déjame buscarlo en la base de datos...");
        
        fetch(`/api/ticket/${val}`)
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    setTimeout(() => {
                        hablarTexto(`Lo siento, no encontré ningún ticket con el código ${val}. Verifica que esté bien escrito.`);
                    }, 2500);
                } else {
                    setTimeout(() => {
                        hablarTexto(`¡Lo encontré! Tu ticket del área de <b>${data.area}</b> actualmente se encuentra en estado: <b>${data.estado}</b>.`);
                    }, 2500);
                }
            })
            .catch(err => {
                setTimeout(() => {
                    hablarTexto("Ups, hubo un problema de conexión al buscar tu ticket.");
                }, 2500);
            });
    }

    // INTELIGENCIA CONTEXTUAL
    const contextRules = {
        'nombre_solicitante': 'Escribe tu nombre completo para saber a quién dirigirnos.',
        'direccion': 'Selecciona la Dirección o Agencia exacta donde te encuentras.',
        'descripcion': 'Sé lo más detallado posible en la descripción del problema para llevar las herramientas correctas.'
    };
    
    const mensajesVistos = new Set();
    for (const [id, msg] of Object.entries(contextRules)) {
        const el = document.getElementById(id);
        if (el) {
            el.addEventListener('focus', () => {
                if (!robotBubble.classList.contains('collapsed') && !mensajesVistos.has(id)) {
                    hablarTexto("💡 Tip: " + msg);
                    mensajesVistos.add(id);
                }
            });
        }
    }

    document.getElementById('form-solicitud').addEventListener('submit', function() {
        robotImg.classList.remove('robot-breathing', 'robot-talking');
        robotImg.classList.add('robot-happy');
        playSFX('pop');
    });

    document.addEventListener("DOMContentLoaded", function() {
        setTimeout(() => {
            // Saludo basado en la hora del día
            const hora = new Date().getHours();
            let saludo = "¡Hola!";
            if (hora < 12) saludo = "¡Buenos días!";
            else if (hora < 19) saludo = "¡Buenas tardes!";
            else saludo = "¡Buenas noches!";
            
            hablarTexto(`${saludo} Soy Robot Carlos, diseñado por DRAJ. Toca mi imagen para ver mis opciones o minimízame si prefieres silencio.`);
        }, 1000);
    });
</script>

    document.addEventListener("DOMContentLoaded", function() {
        const dirSelect = document.getElementById("direccion");

            option.text = dir;
            dirSelect.add(option);

    function actualizarSubAreas() {
        const direccion = document.getElementById("direccion").value;
        const subAreaSelect = document.getElementById("sub_area");
        
        subAreaSelect.innerHTML = '<option value="">Seleccione Oficina...</option>';
        
        if (direccion && subAreas[direccion] && subAreas[direccion].length > 0) {
            subAreas[direccion].forEach(area => {
                let option = document.createElement("option");
                option.value = area;
                option.text = area;
                subAreaSelect.add(option);
            });
        }
    }
</script>
{% endblock %}
